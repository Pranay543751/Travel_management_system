<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Profile</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>

<body>

    <div class="dashboard-container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h2>TravelHub</h2>

            <ul>

                <li>
                    <a href="/admin-dashboard">
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="/manage-users">
                        Manage Users
                    </a>
                </li>

                <li>
                    <a href="/manage-bookings">
                        Manage Bookings
                    </a>
                </li>

                <li>
                    <a href="/contact-messages">
                        Contact Messages
                    </a>
                </li>



                <li>
                    <a href="/admin-logout">
                        Logout
                    </a>
                </li>

            </ul>

        </aside>


        <!-- Main Content -->
        <main class="admin-profile-content">

            <!-- Header -->
            <div class="profile-header">

                <div class="profile-icon">
                    👤
                </div>

                <h1>Admin Profile</h1>

                <p>
                    Manage your administrator account information.
                </p>

            </div>


            <!-- Profile Card -->
            <div class="admin-profile-card">

                <!-- Avatar -->
                <div class="profile-avatar">
                    👤
                </div>


                <!-- Details -->
                <div class="profile-details">

                    <h2>
                        {{ admin[1] }}
                    </h2>


                    <!-- Name -->
                    <div class="profile-row">

                        <span class="label">
                            Name
                        </span>

                        <span class="value">
                            {{ admin[1] }}
                        </span>

                    </div>


                    <!-- Email -->
                    <div class="profile-row">

                        <span class="label">
                            Email
                        </span>

                        <span class="value">
                            {{ admin[2] }}
                        </span>

                    </div>


                    <!-- Phone -->
                    <div class="profile-row">

                        <span class="label">
                            Phone
                        </span>

                        <span class="value">
                            {{ admin[3] }}
                        </span>

                    </div>


                    <!-- Role -->
                    <div class="profile-row">

                        <span class="label">
                            Role
                        </span>

                        <span class="admin-badge">
                            Administrator
                        </span>

                    </div>


                    <!-- Actions -->
                    <div class="profile-actions">

                        <a href="/change-admin-password" class="password-btn">
                            🔐 Change Password
                        </a>

                    </div>

                </div>

            </div>

        </main>

    </div>

</body>

</html>
